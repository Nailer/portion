[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
# Conservative target: Portaldot V3 runs EVM bytecode through pallet-revive's REVM backend.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./out" }]

[fuzz]
runs = 512
