<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
<title id="title">Portion Core current architecture and funding boundaries</title><desc id="desc">Wallet-owned signing connects the frontend to native modules and Core. Verified serverless receipts and documents use Blob. Purchase money goes directly to operators; no milestone escrow exists. Bridge and keepers are outside this release.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#e4edff}.h{font-size:20px;font-weight:bold}.s{font-size:15px}.box{fill:#142039;stroke:#4f7cff;stroke-width:2}.muted{fill:#b0c0d9}.arrow{fill:none;stroke:#80e9ff;stroke-width:2;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#80e9ff"/></marker></defs>
<rect width="1120" height="720" rx="18" fill="#080d1b"/>
<text x="35" y="42" class="h">Portion Core · current testnet architecture</text><text x="35" y="69" class="s muted">24 October 2026 · deployed software and real-world trust boundaries are separate</text>
<rect x="35" y="100" width="320" height="132" rx="12" class="box"/><text x="55" y="130" class="h">Browser + native wallet</text><text x="55" y="158" class="s">Wallet retains signing keys</text><text x="55" y="182" class="s">Chain/code identity and hash checks</text><text x="55" y="206" class="s">No visitor wallet or balance creation</text>
<rect x="405" y="100" width="325" height="132" rx="12" class="box"/><text x="425" y="130" class="h">Portaldot native modules</text><text x="425" y="158" class="s">NFT → fractional shares → approvals</text><text x="425" y="182" class="s">Top-level document storage</text><text x="425" y="206" class="s">Flat atomic batch + address mapping</text>
<rect x="780" y="100" width="305" height="132" rx="12" class="box"/><text x="800" y="130" class="h">Deployed PortionCore</text><text x="800" y="158" class="s">Purchase, stake, deposit, claim</text><text x="800" y="182" class="s">Bond, cadence, default, closure</text><text x="800" y="206" class="s">Configured native test pUSD</text>
<path d="M355 160H400M730 160H775" class="arrow"/>
<rect x="35" y="290" width="320" height="124" rx="12" class="box"/><text x="55" y="320" class="h">Vercel API + Blob</text><text x="55" y="348" class="s">Verified finalized public receipts</text><text x="55" y="372" class="s">Hash-matching document copies</text><text x="55" y="396" class="s">Partial history, not a full archive</text>
<path d="M190 232V285" class="arrow"/>
<rect x="405" y="290" width="325" height="124" rx="12" class="box"/><text x="425" y="320" class="h">Separate credit issuer</text><text x="425" y="348" class="s">Explicit limited test-pUSD grants</text><text x="425" y="372" class="s">Small separate gas budget</text><text x="425" y="396" class="s">No hosted deployment key</text>
<path d="M405 350H360" class="arrow"/>
<rect x="780" y="290" width="305" height="124" rx="12" class="box"/><text x="800" y="320" class="h">Operator money boundary</text><text x="800" y="348" class="s">Purchase proceeds paid directly</text><text x="800" y="372" class="s">1% sale / 0.5% deposit fee</text><text x="800" y="396" class="s">Revenue requires actual deposits</text>
<path d="M930 232V285" class="arrow"/>
<rect x="35" y="460" width="1050" height="105" rx="12" fill="#241e27" stroke="#e2ad69"/><text x="55" y="490" class="h">Protection limit: no purchase-money escrow or spending approval</text><text x="55" y="519" class="s">Core holds offered shares and the limited bond. It cannot force procurement, collect hidden income or insure principal.</text><text x="55" y="544" class="s">A native deed/hash is not independent proof of physical equipment, legal title or regulatory approval.</text>
<text x="35" y="610" class="h">Outside this hosted release</text><text x="35" y="640" class="s muted">Bridge relayers · automatic keepers · complete outside-transaction archive · regulated custody / real-money offering</text><text x="35" y="678" class="s muted">Single-development-account lifecycle finalized. Separate-user browser signing and customer demand still need proof.</text>
</svg>
