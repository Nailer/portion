<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .t { fill:#0e2a22; font-size:15px } .s { fill:#3e5449; font-size:12.5px } .h { fill:#0e2a22; font-size:18px; font-weight:700 }
      .box { fill:#f5f8f2; stroke:#a9b9ad; stroke-width:1.5 } .nat { fill:#d7eef2; stroke:#0b7285; stroke-width:1.5 }
      .evm { fill:#e6defb; stroke:#6741d9; stroke-width:1.5 } .sto { fill:#fde7cf; stroke:#b45309; stroke-width:1.5 }
      .srv { fill:#e8ede6; stroke:#0e2a22; stroke-width:1.5 } .acc { fill:#f5b301; stroke:#0e2a22; stroke-width:1.5 }
      .ln { stroke:#0e2a22; stroke-width:1.6; fill:none; marker-end:url(#a) } .dash { stroke:#72877d; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#a) }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e2a22"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#e8ede6"/>
  <text x="30" y="40" class="h" font-size="22">Portion on Portaldot V3</text>
  <text x="30" y="62" class="s">One signature composes native modules and Solidity in a single atomic extrinsic.</text>

  <!-- browser -->
  <rect x="30" y="90" width="330" height="300" rx="10" class="box"/>
  <text x="46" y="118" class="h">Web app (React)</text>
  <text x="46" y="142" class="t">Market · Tokenize · Portfolio</text>
  <text x="46" y="162" class="t">Network console · Pool Studio</text>
  <text x="46" y="182" class="t">Teleport · Faucet · Guide</text>
  <rect x="46" y="200" width="298" height="52" rx="8" class="acc"/>
  <text x="58" y="222" class="t" font-weight="700">Passport</text>
  <text x="58" y="241" class="s">guest key · MetaMask-derived · import</text>
  <rect x="46" y="266" width="298" height="52" rx="8" class="box"/>
  <text x="58" y="288" class="t" font-weight="700">Under the hood</text>
  <text x="58" y="307" class="s">shows the exact calls of every action</text>
  <rect x="46" y="332" width="298" height="44" rx="8" class="box"/>
  <text x="58" y="359" class="t">Simulated mode when the testnet is down</text>

  <!-- sdk -->
  <rect x="30" y="420" width="330" height="190" rx="10" class="box"/>
  <text x="46" y="448" class="h">@portion/sdk</text>
  <text x="46" y="472" class="t">address mapping (SS58 ↔ H160)</text>
  <text x="46" y="492" class="t">native asset → ERC-20 addressing</text>
  <text x="46" y="512" class="t">revive dry-run, limits, revert decoding</text>
  <text x="46" y="532" class="t">atomic batch planners</text>
  <text x="46" y="552" class="t">on-chain documents · DEX helpers</text>
  <text x="46" y="572" class="t">contract deploy (EVM bytecode)</text>
  <text x="46" y="596" class="s">TypeScript, used by app, server and scripts</text>

  <!-- server -->
  <rect x="410" y="90" width="300" height="520" rx="10" class="srv"/>
  <text x="426" y="118" class="h">Portion server</text>
  <text x="426" y="146" class="t" font-weight="700">Indexer</text><text x="426" y="164" class="s">blocks → documents, contract events</text>
  <text x="426" y="194" class="t" font-weight="700">Document gateway</text><text x="426" y="212" class="s">serves and verifies on-chain files</text>
  <text x="426" y="242" class="t" font-weight="700">Faucet</text><text x="426" y="260" class="s">0x or SS58 → funds the mapped account</text>
  <text x="426" y="290" class="t" font-weight="700">Keepers</text><text x="426" y="308" class="s">slash defaulted bonds · renew documents</text><text x="426" y="324" class="s">compound pool rewards</text>
  <text x="426" y="354" class="t" font-weight="700">Network analysis</text><text x="426" y="372" class="s">halt/control sets, findings, /metrics</text>
  <text x="426" y="402" class="t" font-weight="700">Teleport relayer</text><text x="426" y="420" class="s">2-of-3 EIP-712 signatures, both directions</text>
  <text x="426" y="450" class="t" font-weight="700">SQLite</text><text x="426" y="468" class="s">rebuildable from the chain at any time</text>
  <text x="426" y="500" class="s">Reads are also possible without it:</text>
  <text x="426" y="518" class="s">the app talks to the chain directly.</text>

  <!-- portaldot -->
  <rect x="760" y="90" width="410" height="400" rx="10" class="box"/>
  <text x="776" y="118" class="h">Portaldot V3 runtime</text>
  <rect x="776" y="132" width="378" height="132" rx="8" class="nat"/>
  <text x="790" y="154" class="t" font-weight="700">Native modules</text>
  <text x="790" y="176" class="s">Nfts · NftFractionalization (deed + fixed shares)</text>
  <text x="790" y="194" class="s">Assets + AssetsPrecompiles (pUSD, shares as ERC-20)</text>
  <text x="790" y="212" class="s">AssetConversion (native DEX) · NominationPools</text>
  <text x="790" y="230" class="s">Utility.batchAll (atomic) · Proxy · BEEFY/MMR</text>
  <text x="790" y="250" class="s">(modules Portion uses today, in bold in the Guide)</text>
  <rect x="776" y="276" width="378" height="82" rx="8" class="sto"/>
  <text x="790" y="298" class="t" font-weight="700">TransactionStorage</text>
  <text x="790" y="318" class="s">32 KB per tx, ~7 days retention, renewable</text>
  <text x="790" y="336" class="s">terms + photo of every listing</text>
  <rect x="776" y="370" width="378" height="104" rx="8" class="evm"/>
  <text x="790" y="392" class="t" font-weight="700">pallet-revive (Solidity, EVM bytecode)</text>
  <text x="790" y="412" class="s">Portion.sol: listings, sale, vault, bond, slash</text>
  <text x="790" y="430" class="s">Teleport.sol (home): lock / release pUSD</text>
  <text x="790" y="448" class="s">reads pUSD and shares through ERC-20 precompiles</text>

  <!-- bnb -->
  <rect x="760" y="520" width="410" height="90" rx="10" class="box"/>
  <text x="776" y="548" class="h">BNB Chain testnet</text>
  <text x="776" y="572" class="s">Teleport.sol (remote): mint / burn</text>
  <text x="776" y="590" class="s">WrappedToken wpUSD, MetaMask-friendly</text>

  <!-- arrows -->
  <path class="ln" d="M195 390 L195 418"/>
  <path class="ln" d="M360 250 L408 250"/>
  <path class="ln" d="M360 520 C 560 640 700 640 760 400"/>
  <text x="520" y="655" class="s">signed with the Passport: one batch, one signature</text>
  <path class="dash" d="M710 200 L758 200"/>
  <path class="dash" d="M710 340 L758 340"/>
  <path class="dash" d="M710 460 L758 440"/>
  <path class="dash" d="M710 560 L758 560"/>
  <text x="712" y="186" class="s">reads</text>
  <text x="708" y="550" class="s">relays</text>

  <!-- the batch -->
  <rect x="30" y="640" width="1140" height="96" rx="10" class="box"/>
  <text x="46" y="666" class="h">The headline transaction (one extrinsic, all or nothing)</text>
  <g font-size="12.5">
    <rect x="46" y="680" width="150" height="44" rx="6" class="nat"/><text x="56" y="700" class="t">Nfts.mint</text><text x="56" y="716" class="s">deed NFT</text>
    <rect x="206" y="680" width="160" height="44" rx="6" class="nat"/><text x="216" y="700" class="t">Nfts.setAttribute</text><text x="216" y="716" class="s">terms hash</text>
    <rect x="376" y="680" width="210" height="44" rx="6" class="nat"/><text x="386" y="700" class="t">NftFractionalization</text><text x="386" y="716" class="s">fixed shares, deed locked</text>
    <rect x="596" y="680" width="170" height="44" rx="6" class="nat"/><text x="606" y="700" class="t">Assets.approve ×2</text><text x="606" y="716" class="s">shares + bond</text>
    <rect x="776" y="680" width="230" height="44" rx="6" class="evm"/><text x="786" y="700" class="t">Revive.call</text><text x="786" y="716" class="s">Portion.createListing (Solidity)</text>
    <rect x="1016" y="680" width="140" height="44" rx="6" class="sto"/><text x="1026" y="700" class="t">stored first</text><text x="1026" y="716" class="s">TransactionStorage</text>
  </g>
</svg>
